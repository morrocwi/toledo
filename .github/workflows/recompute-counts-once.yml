name: Recompute Toledo counts once

on:
  push:
    branches:
      - "proposal/zoom-hca-master-weld-2026-10-07"
    paths:
      - ".github/workflows/recompute-counts-once.yml"

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "proposal/zoom-hca-master-weld-2026-10-07"
          fetch-depth: 0
      - name: Recompute canonical counts
        run: python3 scripts/compute_counts.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/recompute-counts-once.yml
      - name: Commit derived counts
        run: |
          git config user.name "toledo-human-registrar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "registry: recompute counts after EQ-002/H.07 admission"
          git push origin HEAD:proposal/zoom-hca-master-weld-2026-10-07

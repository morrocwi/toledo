name: Admit EQ-002-H07 once

on:
  push:
    branches:
      - "proposal/zoom-hca-master-weld-2026-10-07"
    paths:
      - ".github/workflows/admit-eq002-h07-once.yml"

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "proposal/zoom-hca-master-weld-2026-10-07"
          fetch-depth: 0
      - name: Run registrar script
        run: python3 scripts/admit_eq002_h07_once.py
      - name: Commit admission
        run: |
          git config user.name "toledo-human-registrar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "registry: admit EQ-002/H.07.v1 Zoom-HCA master weld"
          git push origin HEAD:proposal/zoom-hca-master-weld-2026-10-07
